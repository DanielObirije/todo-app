name: Detox iOS

on:
  push:
  pull_request:

jobs:
  detox-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install applesimutils
        run: |
          brew tap wix/brew
          brew trust --formula wix/brew/applesimutils
          brew install applesimutils

      - name: Install dependencies
        run: npm ci

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Start Convex
        run: |
          npx convex dev > convex.log 2>&1 &

      - name: Wait for Convex
        run: sleep 10

      - name: Build Detox iOS app
        run: npm run detox:build:ios

      - name: Run Detox iOS tests
        run: npm run detox:test:ios
